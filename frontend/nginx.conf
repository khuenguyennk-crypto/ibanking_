server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/auth/    { proxy_pass http://user-service:8000; }
  location /api/users/   { proxy_pass http://user-service:8000; }
  location /api/accounts { proxy_pass http://account-service:8000; }
  location /api/tuitions { proxy_pass http://tuition-service:8000; }
  location /api/payments { proxy_pass http://payment-service:8000; }

  location / {
    try_files $uri /index.html;
  }
}